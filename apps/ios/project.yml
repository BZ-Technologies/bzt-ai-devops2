name: BZ AI DevOps2
options:
  bundleIdPrefix: ai.openbz
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  OpenBZKit:
    path: ../shared/OpenBZKit
  Swabble:
    path: ../../Swabble

schemes:
  BZ AI DevOps2:
    shared: true
    build:
      targets:
        BZ AI DevOps2: all
    test:
      targets:
        - OpenBZTests
        - OpenBZLogicTests
  OpenBZLogicTests:
    shared: true
    build:
      targets:
        OpenBZLogicTests: all
    test:
      targets:
        - OpenBZLogicTests

targets:
  BZ AI DevOps2:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: OpenBZShareExtension
        embed: true
      - target: OpenBZActivityWidget
        embed: true
      - target: OpenBZWatchApp
      - package: OpenBZKit
      - package: OpenBZKit
        product: OpenBZChatUI
      - package: OpenBZKit
        product: OpenBZProtocol
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../.swiftformat" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Sources/BZ AI DevOps2.entitlements
        CODE_SIGN_STYLE: "$(OPENBZ_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OPENBZ_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENBZ_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(OPENBZ_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          OPENBZ_PUSH_TRANSPORT: direct
          OPENBZ_PUSH_DISTRIBUTION: local
          OPENBZ_PUSH_RELAY_BASE_URL: ""
          OPENBZ_PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          OPENBZ_PUSH_TRANSPORT: direct
          OPENBZ_PUSH_DISTRIBUTION: local
          OPENBZ_PUSH_RELAY_BASE_URL: ""
          OPENBZ_PUSH_APNS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: BZ AI DevOps2
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.openbz.ios
            CFBundleURLSchemes:
              - openbz
        CFBundleShortVersionString: "$(OPENBZ_MARKETING_VERSION)"
        CFBundleVersion: "$(OPENBZ_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - ai.openbz.ios.bgrefresh
        NSLocalNetworkUsageDescription: BZ AI DevOps2 discovers and connects to your BZ AI DevOps2 gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSBonjourServices:
          - _openbz-gw._tcp
        NSCameraUsageDescription: BZ AI DevOps2 can capture photos or short video clips when requested via the gateway.
        NSLocationWhenInUseUsageDescription: BZ AI DevOps2 uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: BZ AI DevOps2 can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: BZ AI DevOps2 needs microphone access for voice wake.
        NSMotionUsageDescription: BZ AI DevOps2 may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: BZ AI DevOps2 needs photo library access when you choose existing photos to share with your assistant.
        NSSpeechRecognitionUsageDescription: BZ AI DevOps2 uses on-device speech recognition for voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        OpenBZPushTransport: "$(OPENBZ_PUSH_TRANSPORT)"
        OpenBZPushDistribution: "$(OPENBZ_PUSH_DISTRIBUTION)"
        OpenBZPushRelayBaseURL: "$(OPENBZ_PUSH_RELAY_BASE_URL)"
        OpenBZPushAPNsEnvironment: "$(OPENBZ_PUSH_APNS_ENVIRONMENT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  OpenBZShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: OpenBZKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(OPENBZ_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OPENBZ_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENBZ_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(OPENBZ_SHARE_PROFILE)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: BZ AI DevOps2 Share
        CFBundleShortVersionString: "$(OPENBZ_MARKETING_VERSION)"
        CFBundleVersion: "$(OPENBZ_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  OpenBZActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/OpenBZActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(OPENBZ_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OPENBZ_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENBZ_ACTIVITY_WIDGET_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: BZ AI DevOps2 Activity
        CFBundleShortVersionString: "$(OPENBZ_MARKETING_VERSION)"
        CFBundleVersion: "$(OPENBZ_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  OpenBZWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
    dependencies:
      - target: OpenBZWatchExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENBZ_WATCH_APP_BUNDLE_ID)"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: BZ AI DevOps2
        CFBundleShortVersionString: "$(OPENBZ_MARKETING_VERSION)"
        CFBundleVersion: "$(OPENBZ_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(OPENBZ_APP_BUNDLE_ID)"
        WKWatchKitApp: true

  OpenBZWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchExtension/Sources
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENBZ_WATCH_EXTENSION_BUNDLE_ID)"
    info:
      path: WatchExtension/Info.plist
      properties:
        CFBundleDisplayName: BZ AI DevOps2
        CFBundleShortVersionString: "$(OPENBZ_MARKETING_VERSION)"
        CFBundleVersion: "$(OPENBZ_BUILD_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: "$(OPENBZ_WATCH_APP_BUNDLE_ID)"
          NSExtensionPointIdentifier: com.apple.watchkit

  OpenBZTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
    dependencies:
      - target: BZ AI DevOps2
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(OPENBZ_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OPENBZ_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.openbz.ios.tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BZ AI DevOps2.app/BZ AI DevOps2"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: OpenBZTests
        CFBundleShortVersionString: "$(OPENBZ_MARKETING_VERSION)"
        CFBundleVersion: "$(OPENBZ_BUILD_VERSION)"

  OpenBZLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
    dependencies:
      - package: OpenBZKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(OPENBZ_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OPENBZ_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.openbz.ios.logic-tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: OpenBZLogicTests
        CFBundleShortVersionString: "$(OPENBZ_MARKETING_VERSION)"
        CFBundleVersion: "$(OPENBZ_BUILD_VERSION)"
