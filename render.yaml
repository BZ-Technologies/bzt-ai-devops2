services:
  - type: web
    name: openbz
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: OPENBZ_STATE_DIR
        value: /data/.openbz
      - key: OPENBZ_WORKSPACE_DIR
        value: /data/workspace
      - key: OPENBZ_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: openbz-data
      mountPath: /data
      sizeGB: 1
